name: Adrenal nnU-Net mask postprocessing tests
on:
  push:
    branches: [research/adrenaspike3d]
    paths:
      - "scripts/postprocess_nnunet_adrenal.py"
      - "scripts/run_nnunet_adrenal_postprocessing.sbatch"
      - "scripts/resume_nnunet_adrenal_postprocessing.sbatch"
      - "scripts/audit_nnunet_adrenal_failures.py"
      - "tests/test_postprocess_nnunet_adrenal.py"
      - ".github/workflows/nnunet-postprocessing-checks.yml"
  pull_request:
    paths:
      - "scripts/postprocess_nnunet_adrenal.py"
      - "tests/test_postprocess_nnunet_adrenal.py"
      - ".github/workflows/nnunet-postprocessing-checks.yml"

jobs:
  postprocessing-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only imaging dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.13,<2" "nibabel>=5.2,<6"
      - name: Syntax verification
        run: |
          bash -n scripts/run_nnunet_adrenal_postprocessing.sbatch
          bash -n scripts/resume_nnunet_adrenal_postprocessing.sbatch
          python -m py_compile scripts/postprocess_nnunet_adrenal.py scripts/audit_nnunet_adrenal_failures.py tests/test_postprocess_nnunet_adrenal.py
      - name: Connected component and NIfTI preservation tests
        run: python -m unittest discover -s tests -p 'test_postprocess_nnunet_adrenal.py' -v
