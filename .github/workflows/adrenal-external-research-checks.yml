name: AdrenaSpike3D external-test and evidence-registry checks
on:
  push:
    branches: [research/adrenaspike3d]
    paths:
      - "scripts/snapshot_adrenal_research_evidence.py"
      - "scripts/plan_totalseg_v3_adrenal_qc.py"
      - "scripts/render_totalseg_v3_adrenal_qc.py"
      - "scripts/run_totalseg_v3_adrenal_qc.sbatch"
      - "scripts/prepare_totalseg_external_adrenal_test.py"
      - "scripts/prepare_totalseg_external_adrenal_test.sbatch"
      - "scripts/validate_totalseg_v3_qc_review.py"
      - "scripts/evaluate_totalseg_external_adrenal.py"
      - "scripts/evaluate_totalseg_external_adrenal.sbatch"
      - "scripts/evaluate_totalseg_external_unreviewed.sbatch"
      - "tests/test_external_totalseg_research.py"
      - "tests/test_totalseg_v3_qc_review_gate.py"
      - ".github/workflows/adrenal-external-research-checks.yml"
  pull_request:
    paths:
      - "scripts/snapshot_adrenal_research_evidence.py"
      - "scripts/plan_totalseg_v3_adrenal_qc.py"
      - "scripts/render_totalseg_v3_adrenal_qc.py"
      - "scripts/run_totalseg_v3_adrenal_qc.sbatch"
      - "scripts/prepare_totalseg_external_adrenal_test.py"
      - "scripts/prepare_totalseg_external_adrenal_test.sbatch"
      - "scripts/validate_totalseg_v3_qc_review.py"
      - "scripts/evaluate_totalseg_external_adrenal.py"
      - "scripts/evaluate_totalseg_external_adrenal.sbatch"
      - "scripts/evaluate_totalseg_external_unreviewed.sbatch"
      - "tests/test_external_totalseg_research.py"
      - "tests/test_totalseg_v3_qc_review_gate.py"
      - ".github/workflows/adrenal-external-research-checks.yml"

jobs:
  cpu-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install imaging and evaluation dependencies (CPU only)
        run: |
          python -m pip install "numpy>=1.26,<3" "scipy>=1.13,<2" "nibabel>=5.2,<6" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Check SLURM bash syntax and Python source
        run: |
          bash -n scripts/run_totalseg_v3_adrenal_qc.sbatch
          bash -n scripts/prepare_totalseg_external_adrenal_test.sbatch
          bash -n scripts/evaluate_totalseg_external_adrenal.sbatch
          bash -n scripts/evaluate_totalseg_external_unreviewed.sbatch
          python -m py_compile scripts/snapshot_adrenal_research_evidence.py scripts/plan_totalseg_v3_adrenal_qc.py scripts/render_totalseg_v3_adrenal_qc.py scripts/prepare_totalseg_external_adrenal_test.py scripts/evaluate_totalseg_external_adrenal.py scripts/validate_totalseg_v3_qc_review.py
      - name: Test frozen research QC and external evaluation pipeline
        run: |
          python -m unittest discover -s tests -p 'test_external_totalseg_research.py' -v
          python -m unittest discover -s tests -p 'test_totalseg_v3_qc_review_gate.py' -v
